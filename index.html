/*__TOKENS_START__*/
/* ============================================================================================================================
   Review #41 – THE design tokens (docs/DESIGN.md). This block is the ONLY place that may set font-family, font-size,
   font-weight or letter-spacing (tests/test_design.py fails otherwise). Ten text styles, one font family, tabular numbers.
   ========================================================================================================================== */
:root {
  /* type: the device's own font – crisp, zero download, no third-party request */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  /* colour – light */
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec;
  --ink: #16181d; --ink-2: #474d5a; --ink-3: #636a77;           /* text in 3 greys */
  --muted: var(--ink-3); --line: #e3e3dd;
  --accent: #2453c4; --accent-soft: #e9eefb; --on-accent: #ffffff;  /* one calm blue */
  --gain: #11733f; --loss: #b8322a; --gain-bg: #e7f4ec; --loss-bg: #fbebea;
  --good: var(--gain); --bad: var(--loss); --good-bg: var(--gain-bg); --bad-bg: var(--loss-bg);
  --warn: #8a5b00; --warn-bg: #fbf2dc; --trim: #a84d0c; --trim-bg: #fbecdf; --neutral-bg: #eeeeea;
  --avg: #a85f17; --v11: #0e7a80;
  --v-buy: var(--gain); --v-acc: #8a6a00; --v-hold: var(--ink-3); --v-trim: var(--trim); --v-avoid: var(--loss);
  /* market tab (review #40) */
.mpick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px } .mpick select { min-height: 44px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; max-width: 100% }
a.chip, .mview a { text-decoration: none; display: inline-flex; align-items: center }
.mpick a[aria-disabled] { opacity: .35; pointer-events: none } .mview { display: flex; gap: 6px; margin-left: auto }
.msec { margin: 18px 0 8px } .mline { margin: 0 }
.today { gap: 6px }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 10px }
.icard { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px 16px; display: grid; gap: 4px; min-width: 0 }
.icard .ih { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.rbar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); margin: 6px 0 0 } .rbar i { position: absolute; top: -3px; width: 4px; height: 12px; margin-left: -2px; border-radius: 2px; background: var(--ink) }
.rlab { display: flex; justify-content: space-between }
.band-cheap { color: var(--gain) } .band-expensive { color: var(--loss) } .band-fair { color: var(--ink-2) }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 8px }
.htile { display: grid; gap: 2px; padding: 12px; border-radius: var(--r-btn); color: var(--ink); text-decoration: none; min-height: 64px }
.adbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 4px 0 12px; background: var(--surface-2) }
.adbar i { display: block; height: 100% } .adbar .up-b { background: var(--gain) } .adbar .dn-b { background: var(--loss) } .adbar .un-b { background: var(--ink-3) }
.mseg { position: static; margin: 8px 0 }
.mcols { display: grid; grid-template-columns: 1fr; gap: 0 12px } @media (min-width: 720px) { .mcols { grid-template-columns: 1fr 1fr } }
.flowbars { width: 100%; height: auto; display: block; margin: 10px 0 4px }
/* mood (review #41 1c) – set by applyMood(); neutral by default */
  --mood-bg: var(--surface); --mood-accent: var(--accent); --mood-glow: transparent;
  /* space & shape: 4/8 grid, radii, two shadow levels */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-card: 16px; --r-btn: 12px; --r-chip: 999px; --r: var(--r-btn);
  --shadow-card: 0 1px 2px rgba(20, 22, 28, .05), 0 2px 8px rgba(20, 22, 28, .04);
  --shadow-sheet: 0 -8px 40px rgba(20, 22, 28, .18);
  --press: 120ms; --ease: cubic-bezier(.2, .7, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0e; --surface: #16181c; --surface-2: #1d2025; --ink: #f2f3f5; --ink-2: #c3c7d0; --ink-3: #959ba8; --line: #2a2e35;
  --accent: #82a7ff; --accent-soft: #1b2440; --on-accent: #0b0c0e; --gain: #4fd08a; --loss: #ff8178; --gain-bg: #10261a; --loss-bg: #2c1513;
  --warn: #e8bd5a; --warn-bg: #2a2210; --trim: #f3a466; --trim-bg: #2e1e12; --neutral-bg: #1f2227; --avg: #d08a3d; --v11: #4fc3c9;
  --v-acc: #e2c24d; --shadow-card: 0 1px 0 rgba(255, 255, 255, .03); --shadow-sheet: 0 -8px 40px rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #16181c; --surface-2: #1d2025; --ink: #f2f3f5; --ink-2: #c3c7d0; --ink-3: #959ba8; --line: #2a2e35;
  --accent: #82a7ff; --accent-soft: #1b2440; --on-accent: #0b0c0e; --gain: #4fd08a; --loss: #ff8178; --gain-bg: #10261a; --loss-bg: #2c1513;
  --warn: #e8bd5a; --warn-bg: #2a2210; --trim: #f3a466; --trim-bg: #2e1e12; --neutral-bg: #1f2227; --avg: #d08a3d; --v11: #4fc3c9;
  --v-acc: #e2c24d; --shadow-card: 0 1px 0 rgba(255, 255, 255, .03); --shadow-sheet: 0 -8px 40px rgba(0, 0, 0, .6); color-scheme: dark }

/* ---- the 10 text styles (size / weight / line-height); rem so iOS text size scales them ---- */
html { font-size: 100% }
body, input, select, textarea, button, code, .copybox { font-family: var(--font) }
body, .t-body, input, select, textarea, h3, .moodline, .card, .urow, .sheetbody, .kv2 { font-size: 1rem; font-weight: 400; line-height: 1.5 }
.t-title, h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em }
.t-heading, h2, .vbig, .sheetbody h2 { font-size: 1.25rem; font-weight: 600; line-height: 1.3; letter-spacing: 0 }
.t-label, .sub, .meta, .mini, .tally, .legend, .foot, .tab, .why, .term .ex, .chk .cw, .chk .cr, .chk ul, .legendbox, .ev .d, .ev .w,
.ev .rx, .helpbody, .parsed, .resplain, .fl, .dcfedit label, .vb, .bmrow, .seccard .kv, .secbtn .sc, table.hist, table.sect, .infobox,
.warnbox, .note, .tip, #tipbox, .lens > summary .ls, .siglist .why, .search label, .bigbtn .bs, .rowbtn .rn .sub, .txrow, .qerr,
.formerr, .help summary, .ev details summary, .chk .cv, .resctl, .empty, .toast, .glist .gs, .krow .km, .gl, .seg-note, .chart text,
h3.minor, .ptr { font-size: .875rem; font-weight: 400; line-height: 1.45; letter-spacing: 0 }
h3.minor { font-weight: 600; letter-spacing: .04em }
.t-number, .num, .price, .kv2 b, .vbv, .krow .kv { font-size: 1rem; font-weight: 600; line-height: 1.4; font-variant-numeric: tabular-nums }
.t-number-lg, .rescount, .rowbtn b.num, .vbtn b, .krow .kpl { font-size: 1.25rem; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums }
.t-number-sm, .chg, .pill, .lens > summary .sc, td.num, .gd { font-size: .875rem; font-weight: 600; line-height: 1.4; font-variant-numeric: tabular-nums }
.t-chip, .chip, .jump a, .seg a, .st, .exp, .badge, .tag, .chgbadge, .tbadge, .bellc { font-size: .875rem; font-weight: 600; line-height: 1.3; letter-spacing: 0 }
.t-button, button, .act, .bigbtn, .go, .more-btn, .back, .clear, summary, .tile { font-size: 1rem; font-weight: 600; line-height: 1.3; letter-spacing: 0 }
.t-display, .hero .big, .gv, .totv, .totv.num, .hero .big.num { font-size: 2.25rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums }
.rescount .num, .sub .num, .mini .num, .legend .num, td .num, .meta .num, .tally .num, .t-label .num { font-size: inherit }
/* emphasis inside any style: weight only */
b, strong, .t-strong, .card .nm, .urow .nm, .term .k, .ev .t, .chk .cn, .lens > summary .ln, .secbtn .sn, .zone, .ex-red, .ex-orange,
table.sect td .nm2, .rowbtn .rn, .bmrow.on, td.hl, tr.med td, table.sect th, .krow .kn, .glist .gt, .tile .tt { font-weight: 600 }
.bigbtn .bs, .rowbtn .rn .sub, .lens > summary { font-weight: 400 }
/*__TOKENS_END__*/

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 46rem; margin: 0 auto; padding-block: 20px 48px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.sub { color: var(--ink-3); margin-top: 4px }
a { color: var(--accent) }
button { color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.up, .gain { color: var(--gain) } .down, .loss { color: var(--loss) } .flat { color: var(--ink-3) }
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px }
.ic.lg { width: 24px; height: 24px }
.ub { color: var(--accent) } .ub .ic { width: 16px; height: 16px; vertical-align: -2px }

/* ---------------------------------------------------------------- tactile: press, tap targets, motion */
button, .act, .chip, .card, a.card, .bigbtn, .tile, .rowbtn, .urow, .krow, .seccard, .secbtn, .vbtn, .tab, .glist a, .seg a, .jump a {
  transition: transform var(--press) var(--ease), background-color var(--press) var(--ease), filter var(--press) var(--ease); -webkit-tap-highlight-color: transparent }
button:active, .act:active, .chip:active, a.card:active, .bigbtn:active, .tile:active, .rowbtn:active, a.urow:active, .krow:active,
.seccard:active, .secbtn:active, .vbtn:active, .glist a:active, .seg a:active, .jump a:active { transform: scale(.97); filter: brightness(.94) }
.act, .chip, .clear, .back, .go, .more-btn, summary, .jump a, .seg a, select, .resctl select { min-height: 44px }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -12px 0 -12px -20px; border: 0; background: none;
  color: var(--accent); cursor: pointer; padding: 0 0 0 20px; vertical-align: middle; line-height: 1 }   /* review #54: the extra tap area sits over the text on the left, so a line-end ⓘ never pokes out on the right */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important } html { scroll-behavior: auto } }
#screen.enter { animation: screen-in 180ms var(--ease) }
@keyframes screen-in { from { opacity: .4; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ---------------------------------------------------------------- search */
.search { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px }
.search label { color: var(--ink-3) }
.search input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface) no-repeat 14px center;
  color: var(--ink); min-height: 52px; box-shadow: var(--shadow-card) }
.search input:focus { border-color: var(--accent); outline: none }
.qrow { display: flex; gap: 8px; position: relative } .qrow input { flex: 1; min-width: 0; padding-right: 48px }
/* review #57: the app's own ✕ (the browser's search cancel differs per engine, so it is hidden) */
.qrow input::-webkit-search-cancel-button, .qrow input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none }
.tbadge { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--loss); color: var(--bg);
  text-align: center }
table.cmp td.cbest { background: var(--gain-bg) } table.cmp th .act { min-width: 44px }
.totop { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 48px; height: 48px; border-radius: 24px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); display: inline-flex; align-items: center; justify-content: center; cursor: pointer }
.tab.tab-side { display: none }   /* review #60: "Learn" in the iPad / desktop side menu; on phones it is the first item in More */
.totop[hidden] { display: none } @media (min-width: 900px) { .totop { bottom: 24px } }
.navstrip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; flex-wrap: wrap } .flipx { display: inline-flex; transform: scaleX(-1) }
.reo { display: flex; gap: 6px; align-items: center; margin: 6px 0 } .reo .act:last-child .ic { transform: rotate(-90deg) } .reo .act:nth-child(2) .ic { transform: rotate(90deg) }
.dragh { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; cursor: grab; color: var(--ink-3); touch-action: none }
.dage { display: block; margin: 2px 0 0 } .dbadge { display: inline-block; padding: 4px 10px; border-radius: 6px; background: var(--warn-bg); color: var(--ink) }
.kbd { display: inline-block; min-width: 2.2em; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: center; margin-right: 8px }
.num, .price, .totv, .gv { -webkit-touch-callout: none }
.brow .act[data-act="bup"] .ic { transform: rotate(90deg) } .brow .act[data-act="bdown"] .ic { transform: rotate(-90deg) }
[data-open] { cursor: pointer } div.urow[data-open]:active { transform: scale(.99); filter: brightness(.96) }
div.urow[data-open]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.fitstar { display: inline-flex; vertical-align: -2px; color: var(--accent) } .fitstar .ic { width: 16px; height: 16px } .styl { margin: 6px 0 0 } .starleg { margin: 8px 0 }
.sugg { display: grid; gap: 4px; margin: 6px 0 0 } .sugg:empty { display: none } .srow { padding: 10px 14px; min-height: 44px }
.recent { margin: 0 0 12px; display: grid; gap: 6px } .recent .chips { margin: 0 }
.btabs { flex-wrap: wrap; margin: 0 0 12px } .btabs a .t-label { margin-left: 4px }
.brow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 8px } .brow input { flex: 1 1 10rem; min-width: 0; min-height: 44px }
.bpick { border: 0; padding: 0; margin: 8px 0; display: grid; gap: 4px } .savedl { margin: 6px 0 0 }
.qbox { flex: 1; min-width: 0; position: relative; display: flex } .qbox input { flex: 1 }
.qclr { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0;
  background: none; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: var(--r-btn) }
.qclr[hidden] { display: none } .qclr:active { transform: translateY(-50%) scale(.94) }
.qrow .qi { position: absolute; left: 14px; top: 16px; color: var(--ink-3); pointer-events: none }
.qrow .go { border: 0; border-radius: var(--r-btn); background: var(--accent); color: var(--on-accent); padding: 0 18px; cursor: pointer; min-height: 52px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-chip); padding: 8px 14px; cursor: pointer; color: var(--ink) }
.chip:hover { border-color: var(--accent) }
.chiprow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch }
.chiprow::-webkit-scrollbar { display: none }
.chiprow .chip { flex: none; white-space: nowrap }
.chip.on, .chips .chip.on, .chiprow .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.resbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 6px 0 12px }
.resctl label { min-width: 0; max-width: 100% } .resctl select { max-width: 100%; min-width: 0; text-overflow: ellipsis }
.rescount { margin: 0 }
.resplain { margin: 0; color: var(--ink-3) }
.resctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.resctl select { padding: 6px 10px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.clear { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-chip); padding: 6px 14px; cursor: pointer }
.qlabel { display: block; margin: 0 0 4px }
.parsed { color: var(--ink-3); margin: 6px 0 12px } .parsed b { color: var(--ink) }

/* ---------------------------------------------------------------- surfaces */
.mood, .panel, .infobox, .cardwrap, .urow, .glist, .ghosts, .tot { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card) }
.mood { padding: 16px; display: grid; gap: 6px; margin-bottom: 14px } .mood p { margin: 0 }
.infobox { padding: 12px 16px; margin-bottom: 12px }
.warnbox { background: var(--warn-bg); color: var(--ink); border-radius: var(--r-card); padding: 12px 16px; margin-bottom: 12px }
.panel { padding: 16px; margin-bottom: 14px; min-width: 0 }
.panel h2 { margin-bottom: 10px }
.note { background: var(--warn-bg); border-radius: var(--r-btn); padding: 10px 12px; margin-bottom: 8px }
.foot { color: var(--ink-3); margin-top: 24px; display: grid; gap: 4px; overflow-wrap: anywhere }
hr, .hair { border: 0; border-top: 1px solid var(--line); margin: 12px 0 }

/* ---------------------------------------------------------------- cards (search results) */
.cards { display: grid; gap: 10px; grid-template-columns: 1fr }
@media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr } }
.card { text-align: left; background: var(--surface); border: 0; border-radius: var(--r-card); padding: 14px 16px; cursor: pointer; display: grid; gap: 8px;
  min-width: 0; box-shadow: var(--shadow-card); color: var(--ink) }
a.card { color: var(--ink); text-decoration: none } a.card .nm { color: var(--ink) }
.card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }
.card .nm { min-width: 0 }
.card .meta { color: var(--ink-3) }
.price { white-space: nowrap }
.chg, .pill { white-space: nowrap }
.pill { display: inline-flex; align-items: center; gap: 2px; border-radius: var(--r-chip); padding: 2px 8px; background: var(--surface-2) }
.pill.up { background: var(--gain-bg) } .pill.down { background: var(--loss-bg) }
.sig { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.sig li { display: flex; gap: 8px; align-items: flex-start } .sig .dot { flex: none }
.tally { color: var(--ink-3) }
.more-btn { margin: 16px auto 0; display: block; padding: 10px 18px; border-radius: var(--r-chip); border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.empty { color: var(--ink-3); padding: 32px 8px; text-align: center }
.qerr { color: var(--ink); background: var(--warn-bg); display: inline-block; padding: 6px 10px; border-radius: var(--r-btn) }
.help { border: 0; padding: 0; margin: 0 } .help summary { min-height: 44px; padding: 2px 0 }
.helpbody { color: var(--ink-3); display: grid; gap: 6px; max-height: 40vh; overflow-y: auto } .helpbody p { margin: 0 }
.score { margin: 0 0 12px }
h3.minor { margin: 16px 0 8px; color: var(--ink-3); text-transform: uppercase }
.tablewrap { overflow-x: auto; margin: 8px 0 12px }
table.hist { border-collapse: collapse; min-width: 100% }
table.hist th, table.hist td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums }
table.hist th:first-child, table.hist td:first-child { text-align: left }
table.hist th { color: var(--ink-3) }
table.hist.pf2 { min-width: 0; width: 100% } table.hist.pf2 th, table.hist.pf2 td { white-space: normal; padding: 6px 4px; vertical-align: top }
table.hist td.l { text-align: left; white-space: normal; min-width: 9rem }
table.hist td.hl { background: var(--accent-soft) }

/* ---------------------------------------------------------------- stock view */
.back { background: none; border: 0; color: var(--accent); padding: 8px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px }
.hero { display: grid; gap: 4px; margin: 6px 0 16px; padding: 16px; border-radius: var(--r-card); background: var(--mood-bg); transition: background-color 300ms var(--ease) }
.hero .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap }
.siglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.siglist li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 12px; border-radius: var(--r-btn) }
.siglist .why { grid-column: 2; color: var(--ink-3) }
.light-green { background: var(--gain-bg) } .light-yellow { background: var(--warn-bg) } .light-red { background: var(--loss-bg) }
details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px }
summary { cursor: pointer; color: var(--accent); padding: 10px 0; list-style-position: inside }
.terms { display: grid; gap: 12px; margin-top: 10px } .term { display: grid; gap: 2px }
.term .k { display: flex; justify-content: space-between; gap: 12px } .term .ex { color: var(--ink-3) }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r-card); overflow: hidden; margin: 0 0 14px; box-shadow: var(--shadow-card) }
.metrics > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
@media (max-width: 480px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.chart { position: relative; touch-action: pan-y } .chart svg { width: 100%; height: auto; display: block }
.legend { display: flex; gap: 16px; color: var(--ink-3); margin-bottom: 6px; flex-wrap: wrap }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%) }
.chart text { fill: var(--ink-3) }

/* Stage 3: investor view, ownership & management, decisions timeline */
.badge { display: inline-block; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-3); vertical-align: 1px }
.badge.stated { color: var(--accent); border-color: var(--accent) }
.st { display: inline-block; padding: 2px 8px; border-radius: var(--r-chip); white-space: nowrap }
.st-pass { background: var(--gain-bg); color: var(--gain) } .st-fail { background: var(--loss-bg); color: var(--loss) }
.st-judge { background: var(--accent-soft); color: var(--accent) } .st-partial { background: var(--warn-bg); color: var(--warn) }
.st-none { background: transparent; color: var(--ink-3); border: 1px dashed var(--line) }
.lens { border: 1px solid var(--line); border-radius: var(--r-btn); margin: 0 0 8px; padding: 0 }
.lens > summary { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; color: var(--ink); list-style: none }
.lens > summary::-webkit-details-marker { display: none }
.lens > summary .ls { grid-column: 2 / 4; color: var(--ink-3) }
.lens > summary .sc { white-space: nowrap; text-align: right }
.lens[open] > summary { border-bottom: 1px solid var(--line) }
.lensbody { padding: 10px 12px 12px; display: grid; gap: 10px }
.chk { display: grid; gap: 3px; padding-bottom: 10px; border-bottom: 1px solid var(--line) } .chk:last-child { border-bottom: 0; padding-bottom: 0 }
.chk .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
.chk .cw, .chk .cr { color: var(--ink-3) } .chk ul { margin: 2px 0 0; padding-left: 18px; color: var(--ink-3) }
.legendbox { color: var(--ink-3); display: grid; gap: 4px; margin: 4px 0 10px }
.ev { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border-radius: var(--r-btn); margin-bottom: 8px; border: 1px solid var(--line) }
.ev .d { grid-column: 2; color: var(--ink-3) } .ev .w, .ev .rx { grid-column: 2 } .ev .w { color: var(--ink-3) }
.ev details { grid-column: 2; border-top: 0; padding-top: 0; margin-top: 0 } .ev details summary { min-height: 44px; padding: 2px 0 }
.ev.imp-green { background: var(--gain-bg); border-color: transparent } .ev.imp-red { background: var(--loss-bg); border-color: transparent }
.ev.imp-yellow { background: var(--warn-bg); border-color: transparent }
.exp { display: inline-block; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 1px 6px; vertical-align: middle; text-transform: none }
.pfl { margin: 6px 0; padding-left: 22px; columns: 2; column-gap: 16px } .pfl li { break-inside: avoid }
.bm { border-top: 1px solid var(--line); padding: 8px 0 } .bmh { display: flex; justify-content: space-between; gap: 8px }
.bmrow { display: grid; grid-template-columns: 7.5rem 1fr; gap: 8px; padding: 2px 6px; border-radius: 6px }
.bmrow.on { background: var(--accent-soft) } .bml { color: var(--ink-3) }

/* Stage 4: verdicts, valuation, settings */
.vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 8px; margin-top: 4px }
.vbtn { display: flex; align-items: center; gap: 8px; border: 0; border-radius: var(--r-btn); padding: 10px 12px; background: var(--surface); cursor: pointer; text-align: left; min-height: 48px; color: var(--ink) }
.vbtn .vn { flex: 1; min-width: 0 } .vbtn.qos { margin-top: 8px; width: 100% }
.v-buy.vbtn, .verdict.v-buy { background: var(--gain-bg) } .v-acc.vbtn, .verdict.v-acc { background: var(--warn-bg) }
.v-hold.vbtn, .verdict.v-hold { background: var(--neutral-bg) } .v-trim.vbtn, .verdict.v-trim { background: var(--trim-bg) }
.v-avoid.vbtn, .verdict.v-avoid { background: var(--loss-bg) }
.verdict { border-color: transparent } .vbig { margin: 0 0 4px }
.settings > summary { color: var(--ink) }
.sw { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 44px }
.sw input { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: var(--accent) }
.sw.later { opacity: .6 } .sw.master { border-bottom: 2px solid var(--line) }
.vbars { display: grid; gap: 8px; margin: 12px 0 6px }
.vb { display: grid; grid-template-columns: minmax(0, 8.5rem) minmax(3rem, 1fr) minmax(0, 4.6rem); gap: 8px; align-items: center }
.vb > *, .chk > *, .chk .top > * { min-width: 0; overflow-wrap: anywhere } .chk .cv .st { white-space: normal; max-width: 100% } .vb.ref { opacity: .65 }
.vbt { position: relative; height: 14px; background: var(--neutral-bg); border-radius: 7px }
.vbt .rng { position: absolute; top: 3px; height: 8px; border-radius: 4px; background: var(--ink-3); opacity: .45 }
.vbt .mid { position: absolute; top: 0; width: 3px; height: 14px; margin-left: -1px; background: var(--ink); border-radius: 1px }
.vbt .pr { position: absolute; top: -3px; width: 2px; height: 20px; margin-left: -1px; background: var(--accent) }
.vbv { text-align: right; white-space: nowrap }
.dcfedit { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 8px 0 }
.dcfedit label { display: grid; gap: 2px; color: var(--ink-3) }
.dcfedit input { width: 7rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface); color: var(--ink); min-height: 44px }
/* sector screeners */
.secgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 8px; margin-top: 6px }
.secbtn { display: grid; gap: 2px; text-align: left; padding: 12px; border-radius: var(--r-btn); border: 0; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: var(--shadow-card); min-height: 56px }
.secbtn:hover, .secbtn:focus-visible { outline: 2px solid var(--accent) } .secbtn .sc { color: var(--ink-3) }
table.sect { border-collapse: collapse; min-width: 100% }
table.sect th, table.sect td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums }
table.sect th:first-child, table.sect td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface) }
table.sect th { cursor: pointer; color: var(--ink-3); user-select: none } table.sect th[aria-sort] { color: var(--ink) }
table.sect tbody tr { cursor: pointer } table.sect tbody tr:hover td { background: var(--accent-soft) }
table.sect tr.med td { background: var(--neutral-bg); cursor: default }
table.sect td.good { color: var(--gain) } table.sect td.bad { color: var(--loss) }
table.sect td .nm2 { display: block; color: var(--ink) } table.sect td .sy { color: var(--ink-3) }
.seccards { display: grid; gap: 8px }
.seccard { display: grid; gap: 4px; text-align: left; padding: 12px; border-radius: var(--r-btn); border: 0; background: var(--surface); color: var(--ink); cursor: pointer; width: 100%; box-shadow: var(--shadow-card) }
.seccard .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px }
.seccard .kv span { display: flex; justify-content: space-between; gap: 6px } .seccard .kv b.good { color: var(--gain) } .seccard .kv b.bad { color: var(--loss) }
.seccard.med { cursor: default; background: var(--neutral-bg) }
.secwide { display: none } body.wide-view .wrap { max-width: 80rem }
@media (min-width: 720px) { .secwide { display: block } .secnarrow { display: none } }

/* ---------------------------------------------------------------- app layout: tab bar (left rail on wide screens) */
html { scroll-padding-top: 64px }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) }
.wrap { padding-block: 16px 24px }
.scr-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; padding: 6px 2px;
  text-decoration: none; color: var(--ink-3); position: relative }
.tab .ic { width: 24px; height: 24px }
.tab[aria-current="page"] { color: var(--mood-accent) }
.tab[aria-current="page"] .ic { stroke-width: 2.25 }
@media (min-width: 1000px) {
  .tab.tab-side { display: flex }
  .tabbar { top: 0; right: auto; width: 92px; flex-direction: column; justify-content: flex-start; padding-top: 18px; border-top: 0; border-right: 1px solid var(--line) }
  .tab { flex: none; min-height: 72px }
  body { padding-left: 108px; padding-bottom: 24px }
}
.bigbtns { display: grid; gap: 10px; margin: 4px 0 14px }
@media (min-width: 640px) { .bigbtns { grid-template-columns: repeat(3, 1fr) } }
.bigbtn, .tile { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--r-card); border: 0; background: var(--surface);
  color: var(--ink); text-decoration: none; min-height: 64px; box-shadow: var(--shadow-card) }
.bigbtn .bs, .tile .ts { display: block; color: var(--ink-3) }
.tile .ib2 { display: inline-flex; width: 40px; height: 40px; border-radius: 12px; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); flex: none }
.moodline { display: flex; gap: 8px; align-items: baseline; margin: 0 0 14px; color: var(--ink-2) }
.rowlist { display: grid; gap: 8px }
.rowbtn { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); border: 0; text-decoration: none; color: var(--ink); min-height: 56px; background: var(--surface); box-shadow: var(--shadow-card) }
.rowbtn .ri { flex: none } .rowbtn .rn { flex: 1; min-width: 0 } .rowbtn .rn .sub { display: block; margin: 0 }
.rowbtn::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-top: 2px solid var(--ink-3); transform: rotate(45deg); flex: none; margin-right: 4px }
.rowbtn.v-buy { background: var(--gain-bg) } .rowbtn.v-acc { background: var(--warn-bg) } .rowbtn.v-hold { background: var(--neutral-bg) }
.rowbtn.v-trim { background: var(--trim-bg) } .rowbtn.v-avoid { background: var(--loss-bg) }
/* grouped list (iOS Settings feel): one surface, hairline dividers, chevrons */
.glist { display: grid; overflow: hidden; margin: 0 0 16px; padding: 0 }
.glist > a, .glist > button, .glist > .gi { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; color: var(--ink); text-decoration: none;
  background: none; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; cursor: pointer }
.glist > :first-child { border-top: 0 }
.glist .gi-ic { display: inline-flex; width: 32px; height: 32px; border-radius: 9px; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); flex: none }
.glist .gt { flex: 1; min-width: 0 } .glist .gs { display: block; color: var(--ink-3) }
.glist > a::after, .glist > button.chev::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-top: 2px solid var(--ink-3); transform: rotate(45deg); flex: none; margin-right: 4px }
.gl { color: var(--ink-3); margin: 18px 4px 6px; text-transform: none }
/* stock page: section switcher (segmented) */
.jump, .seg { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 6px 0; margin: 0 0 10px }
.jump::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none }
.jump a, .seg a { flex: none; text-decoration: none; padding: 10px 14px; border-radius: var(--r-chip); background: var(--surface-2); color: var(--ink-2); display: inline-flex; align-items: center }
.jump a.on, .seg a.on { background: var(--ink); color: var(--bg) }
.jsec { scroll-margin-top: 64px }
.jsec:last-child { min-height: calc(100vh - 160px) }
@media (max-width: 640px) { .scr-h { margin: 0 0 10px } .resbar { margin: 4px 0 10px }
  .qlabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) } }
#tipbox { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: 36rem; margin: 0 auto;
  background: var(--ink); color: var(--bg); border-radius: var(--r-card); padding: 12px 14px; box-shadow: var(--shadow-sheet) }
#tipbox b { color: var(--bg) }
@media (min-width: 1000px) { #tipbox { bottom: 20px; left: 120px } }
.gloss { display: grid; gap: 10px } .gloss .term { padding-bottom: 8px; border-bottom: 1px solid var(--line) }

/* ---------------------------------------------------------------- watchlist + portfolio */
.cardwrap { display: grid; min-width: 0 } .cardwrap a.card { box-shadow: none; background: none }
.cardact, .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center } .cardact { padding: 0 16px 12px }
.act { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-btn); padding: 8px 14px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.act:hover { border-color: var(--ink-3) } .act.big { padding: 12px 18px; min-height: 48px }
.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.act.icon { width: 44px; padding: 0; justify-content: center }
.ulist { display: grid; gap: 10px }
.urow { display: grid; gap: 4px; padding: 12px 16px; color: var(--ink); text-decoration: none; min-width: 0; border: 0 }
.urow p { margin: 0 } .urow .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between }
.urow .nm { color: var(--ink); text-decoration: none; min-width: 0 }
.chgbadge { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 1px 6px }
.z-in { color: var(--gain) } .z-above { color: var(--warn) } .warnline { color: var(--loss) }
.osw { color: var(--warn) }
.topbar { display: flex; justify-content: flex-end; min-height: 44px; margin: 0 0 -8px }
.bell { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--ink-2) }
.bellc { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; display: inline-flex; align-items: center; justify-content: center }
.bellc[hidden] { display: none }
.alitem, .ckrow { padding: 10px 0; border-top: 1px solid var(--line) } .alitem:first-of-type, .ckrow:first-child { border-top: 0 } .al-seen { opacity: .75 }
.nfb { white-space: nowrap } .nf-red { color: var(--bad) } .nf-yellow { color: var(--warn) }
.kv2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: baseline } .kv2 b { text-align: right }
.kv2 > * { min-width: 0; overflow-wrap: anywhere } .tot { grid-template-columns: minmax(0, 1fr) } .tot > * { min-width: 0 }
.act { max-width: 100%; white-space: normal } p a, .mini a, .sub a { overflow-wrap: anywhere }   /* review #54: a long button label wraps instead of widening the page (WebKit) */
.honest { margin: 14px 0 0 }
.txrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.exl { margin: 0 } .ex-red { color: var(--loss) } .ex-orange { color: var(--trim) } .ex-yellow { color: var(--warn) } .ex-green { color: var(--gain) }
.urow.ex-row-red { box-shadow: inset 0 0 0 2px var(--loss) }
.exbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px }
.act.exf.on, .uni .act.on, .rr .act.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
a.exalert { display: block; text-decoration: none; color: var(--ink); background: var(--loss-bg) }
.copybox { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border-radius: var(--r-btn); padding: 10px 12px; margin: 0 0 8px; user-select: all; -webkit-user-select: all }
.copied { color: var(--gain) }
.gsec > summary { color: var(--ink) } .gsec code { background: var(--surface-2); padding: 0 4px; border-radius: 4px }
.firstnote .act { margin-left: 6px }
.uni { display: flex; gap: 8px; margin: 0 0 10px } .uni .act.on .sub { color: var(--bg) } .uninote { margin: 0 0 10px }
.tag { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--neutral-bg); color: var(--ink-3); white-space: nowrap }
.tag.warn { background: var(--warn-bg); color: var(--warn) }
.formerr { color: var(--loss); margin: 0; min-height: 1.2em }
/* totals card + Kite-style rows */
.tot { padding: 18px; margin: 0 0 14px; display: grid; gap: 10px; background: var(--mood-bg); transition: background-color 300ms var(--ease), box-shadow 300ms var(--ease);
  box-shadow: var(--shadow-card), 0 0 0 1px var(--mood-glow) }
.tot .tl { color: var(--ink-3) } .tot .kv2 { gap: 4px 14px }
.tot .moodsw { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.krows { display: grid; overflow: hidden; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-card); margin: 0 0 14px }
.krow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; position: relative; background: var(--surface) }
.krow:first-child { border-top: 0 }
.krow .km { color: var(--ink-3) } .krow .kr { text-align: right } .krow .kx { grid-column: 1 / -1; display: grid; gap: 2px }
/* home */
.hello { margin: 4px 0 16px } .hello .sub { margin-top: 2px }
.ghosts { padding: 16px; margin: 0 0 14px; display: grid; gap: 12px; text-decoration: none; color: var(--ink); background: var(--mood-bg); transition: background-color 300ms var(--ease) }
.ghosts .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.ghosts .gcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.ghosts .gc > * { overflow-wrap: anywhere }
@media (max-width: 359px) { .ghosts .gcols { grid-template-columns: minmax(0, 1fr) } }   /* review #54: 320 px phones – one column */
.ghosts .gc { display: grid; gap: 2px; min-width: 0 } .ghosts .spark { width: 100%; height: 44px; display: block }
.tiles { display: grid; gap: 10px; margin: 0 0 14px } @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr) } }
.tile .tt { display: block }
/* bottom sheet */
#sheet { border: 0; padding: 0; margin: auto auto 0; width: min(40rem, 100vw); max-width: 100vw; max-height: 88vh; background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; box-shadow: var(--shadow-sheet); padding-bottom: env(safe-area-inset-bottom, 0px) }
#sheet[open] { animation: sheet-up 260ms var(--ease) }
#sheet::backdrop { background: rgba(0, 0, 0, .4) }
#sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0 }
@keyframes sheet-up { from { transform: translateY(100%) } to { transform: none } }
.sheetbody { padding: 12px 18px 18px; display: grid; gap: 12px }
.fl { display: grid; gap: 4px; color: var(--ink-3) }
.fl input, .fl textarea { color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 10px 12px; min-height: 44px; min-width: 0; width: 100%; box-sizing: border-box }
/* toasts */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 12px }
@media (min-width: 1000px) { #toasts { bottom: 24px; left: 108px } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r-btn); padding: 6px 6px 6px 16px;
  box-shadow: var(--shadow-sheet); max-width: 32rem; animation: toast-in 200ms var(--ease) }
.toast button { background: none; border: 0; color: var(--bg); padding: 0 14px; min-height: 44px; cursor: pointer; text-decoration: underline }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
/* skeleton loaders: grey shapes with reserved heights – no spinner, no layout jump */

l},"signals":{"peer_good":60,"peer_weak":30,"rules":{"roce":{"higher":true,"never_green_below":10,"never_red_from":20,"why":"return on capital – under 10% rarely beats the cost of money; 20%+ is strong anywhere","src":"sector peers + absolute guard-rails"},"roe":{"higher":true,"never_green_below":10,"never_red_from":20,"why":"return on shareholders' money – same guard-rails as ROCE","src":"sector peers + guard-rails"},"de":{"higher":false,"never_green_above":2.0,"skip_groups":["bank","nbfc","insurance"],"why":"borrowing vs net worth – above 2× is never comfortable (banks and NBFCs borrow by design, so not judged here)","src":"sector peers + guard-rail"},"icr":{"higher":true,"red_below":1.5,"why":"how many times profit covers interest – under 1.5× is risky","src":"sector peers + guard-rail"},"cfo_pat":{"higher":true,"red_below":0.6,"green_from":0.9,"why":"how much of the profit arrives as cash over 3–5 years","src":"absolute bands"},"op_margin":{"higher":true,"why":"operating profit per ₹100 of sales vs its sector","src":"sector peers"},"sales_cagr":{"higher":true,"why":"sales growth per year vs its sector","src":"sector peers"},"eps_cagr":{"higher":true,"why":"earnings-per-share growth per year vs its sector","src":"sector peers"},"pe":{"higher":false,"why":"price vs profit – lower than its sector is cheaper (also compare with its own 5-year range)","src":"sector peers"},"pb":{"higher":false,"why":"price vs book value – lower than its sector is cheaper","src":"sector peers"},"pledge":{"higher":false,"red_above":25,"green_at_or_below":0,"why":"promoter shares pledged – over 25% is a red flag, none is best","src":"absolute bands"},"fscore":{"band":[7,3],"why":"Piotroski F-score: 7–9 strong, 4–6 average, 0–3 weak","src":"Piotroski (2000)"},"core":{"band":[70,50],"why":"Core score: 70+ good, 50–69 OK, under 50 weak (the verdict engine's bands)","src":"Rules v1.0 scale"},"health":{"band":[70,50],"why":"Business health: 70+ good, 50–69 OK, under 50 weak","src":"the verdict engine's bands"},"rsi14":{"stretch":[70,30],"why":"RSI over 70 = stretched, under 30 = oversold – a state, never good or bad","src":"Wilder (1978)"},"pct_from_high52":{"higher":true,"why":"distance from the 1-year high vs its sector","src":"sector peers"}},"neutral":["close","volume","mcap_cr","shares","date"],"size":{"large":100,"mid":250,"src":"AMFI categorisation: large cap = top 100 by full market cap, mid cap = 101–250, small cap = the rest"}},"styles":{"config":{"moat":{"roce_min":15.0,"years_min":3,"de_max":0.5,"max_sales_drop_pct":5.0},"asset":{"pb_max":1.5,"de_max":1.0},"lender_groups":["bank","nbfc","insurance","fin_other"],"rate_groups":["it"],"rate_words":["oil","gas","refiner","petroleum","export"]},"lenses":{"moat":["buffett","munger","coffeecan","qglp"],"fast":["lynch","kedia","fisher"],"cyclical":["lynch"],"asset":["graham","greenblatt"],"lender":["buffett","qglp"],"turnaround":["lynch"],"rate":[]},"labels":{"moat":"steady moat business","fast":"fast grower","cyclical":"cyclical","asset":"asset-cheap","lender":"bank / lender / insurer","turnaround":"turnaround","rate":"rate / currency sensitive"},"legend":"★ = this style was built for this type of business. It is not a buy signal.","fast_rule":"fast grower, cyclical, turnaround and asset play come from the Peter Lynch lens's own sorting"},"glossary":{"groups":["Profitability","Valuation","Debt & safety","Growth","Cash flow","Efficiency","Ownership","Technicals","Market","Portfolio & tax","Scores & rules"],"terms":{"roce":{"name":"ROCE (return on capital employed)","group":"Profitability","meaning":"How much operating profit the business makes on all the money invested in it – shareholders' and lenders'.","formula":"ROCE = EBIT ÷ (Net worth + Borrowings) × 100","source":"P&L: EBIT (operating profit). Balance sheet: net worth (equity) + borrowings, for the latest year.","better":"higher","why":"More profit from each ₹100 of capital means the business turns money into profit efficiently.","sector_notes":"Banks, NBFCs and insurers: ROCE isn't meaningful (borrowing is their raw material) – look at ROA and ROE instead.","example":"EBIT ₹300 crore ÷ capital ₹1,500 crore = ROCE 20%.","mistakes":"A one-off gain inflates EBIT for a year; a company sitting on cash shows a lower ROCE than its business earns.","related":["roe","roa","op_margin","roce_avg"],"tab":"health","field":"roce","signal":"roce"},"roce_avg":{"name":"Average ROCE","group":"Profitability","meaning":"ROCE averaged over the last (up to) 5 years we have – one good year can't make a business look strong.","formula":"Average ROCE = mean of the yearly ROCE values (last 5 years at most)","source":"The yearly ROCE history (see ROCE).","better":"higher","why":"A high average shows the business earns well across the cycle, not only in one year.","related":["roce"],"tab":"health","field":"roce_avg"},"roe":{"name":"ROE (return on equity)","group":"Profitability","meaning":"Profit for shareholders per ₹100 of their own money in the company.","formula":"ROE = Net profit ÷ Average net worth (this year and last) × 100","source":"P&L: profit after tax. Balance sheet: net worth at the start and end of the year (average).","better":"higher","why":"Shows how well the company grows the owners' money.","sector_notes":"Banks and NBFCs: ROE is a key number (12–18% is healthy). Very high ROE with high debt can be borrowed, not earned.","example":"Profit ₹150 crore ÷ average net worth ₹1,000 crore = ROE 15%.","mistakes":"Buybacks and losses shrink net worth and push ROE up without any better business.","related":["roce","roa","de"],"tab":"health","field":"roe","signal":"roe"},"roa":{"name":"ROA (return on assets)","group":"Profitability","meaning":"Profit per ₹100 of everything the company owns.","formula":"ROA = Net profit ÷ Average total assets × 100","source":"P&L: profit after tax. Balance sheet: total assets, average of this year and last.","better":"higher","why":"The best single return measure for lenders, whose assets are mostly loans.","sector_notes":"Banks: above 1% is good, above 1.5% very good. Manufacturers usually 5–15%.","example":"Profit ₹120 crore ÷ assets ₹10,000 crore = ROA 1.2% (a good bank).","related":["roe","roce"],"tab":"health","field":"roa"},"op_margin":{"name":"Operating margin","group":"Profitability","meaning":"Operating profit from every ₹100 of sales.","formula":"Operating margin = EBIT ÷ Revenue × 100","source":"P&L: EBIT and revenue from operations, latest year.","better":"higher","why":"A higher margin means pricing power or lower costs – more room when times are hard.","sector_notes":"Compare only within a sector: retail and trading run on thin margins, software and branded goods on fat ones.","example":"EBIT ₹200 crore on sales ₹1,000 crore = 20%.","related":["roce","ebitda"],"tab":"health","field":"op_margin","signal":"op_margin"},"ebitda":{"name":"EBITDA","group":"Profitability","meaning":"Operating profit before depreciation and amortisation – a rough measure of the cash the business earns from operations.","formula":"EBITDA = Operating profit (EBIT) + Depreciation + Amortisation","source":"P&L: EBITDA as reported in the statements (latest year or last 4 quarters).","better":"higher","why":"Used to compare businesses with different asset ages and in EV/EBITDA.","sector_notes":"Banks, NBFCs and insurers don't use EBITDA – interest is their main cost and their main income.","example":"EBIT ₹200 crore + depreciation ₹50 crore = EBITDA ₹250 crore.","mistakes":"It ignores the cost of replacing machines; capital-heavy businesses look better on EBITDA than they are.","related":["ev_ebitda","op_margin"],"tab":"fair"},"pe":{"name":"P/E (price to earnings)","group":"Valuation","meaning":"How many rupees you pay for each rupee of yearly profit.","formula":"P/E = Share price ÷ Earnings per share (last 12 months)","source":"Price: tonight's NSE close. EPS: profit after tax of the last 4 quarters (TTM) ÷ shares.","better":"lower","why":"Lower is cheaper for the same profit – but compare with the sector and the company's own history.","sector_notes":"Cyclicals (metals, cement): a low P/E can mean peak earnings, not a bargain. Loss-making companies have no P/E.","example":"Price ₹500 ÷ EPS ₹25 = P/E 20.","mistakes":"Profit with a one-off gain makes P/E look cheap; fast growers deserve higher P/Es (see PEG).","related":["peg","eps","earnings_yield","peband"],"tab":"fair","field":"pe","signal":"pe"},"pb":{"name":"P/B (price to book)","group":"Valuation","meaning":"Market value of the company compared with its net worth on the books.","formula":"P/B = Market cap ÷ Net worth","source":"Market cap: tonight's close × shares. Net worth: latest balance sheet.","better":"lower","why":"Under 1 means you pay less than the books say the company owns.","sector_notes":"The main valuation number for banks and NBFCs. Brands and software firms trade at high P/B because their value isn't on the books.","example":"Market cap ₹3,000 crore ÷ net worth ₹1,500 crore = P/B 2.","related":["pe","roe"],"tab":"fair","field":"pb","signal":"pb"},"ev_ebitda":{"name":"EV/EBITDA","group":"Valuation","meaning":"Price of the whole business (shares + debt − cash) compared with its operating cash earnings.","formula":"EV/EBITDA = (Market cap + Borrowings − Cash) ÷ EBITDA","source":"Market cap: tonight's close × shares. Borrowings and cash: latest balance sheet. EBITDA: last 12 months.","better":"lower","why":"It is neutral to how much debt a company has, so it compares companies better than P/E.","sector_notes":"Not used for banks, NBFCs and insurers.","example":"EV ₹6,000 crore ÷ EBITDA ₹600 crore = 10×.","related":["ebitda","pe","evebitda"],"tab":"fair","field":"ev_ebitda"},"earnings_yield":{"name":"Earnings yield","group":"Valuation","meaning":"Operating profit as a % of the price of the whole business – P/E turned upside down.","formula":"Earnings yield = EBIT ÷ Enterprise value × 100","source":"EBIT (last 12 months) and EV (market cap + borrowings − cash).","better":"higher","why":"A higher yield is cheaper; Greenblatt's Magic Formula ranks on it.","related":["ev_ebitda","pe"],"tab":"fair","field":"earnings_yield"},"peg":{"name":"PEG","group":"Valuation","meaning":"P/E compared with how fast earnings grow.","formula":"PEG = P/E ÷ EPS growth per year (%)","source":"P/E tonight; EPS growth = CAGR over the years we have.","better":"lower","why":"Under 1 = cheap for its growth (Peter Lynch's rule of thumb), 2+ = expensive.","related":["pe","eps_cagr"],"tab":"fair","field":"peg"},"eps":{"name":"EPS (earnings per share)","group":"Valuation","meaning":"The company's profit divided among its shares.","formula":"EPS = Profit after tax (last 12 months) ÷ Number of shares","source":"P&L: profit after tax for the last 4 quarters; shares from the newest filing.","better":"higher","why":"Growing EPS is what lifts a share price over the long run.","related":["pe","eps_cagr"],"tab":"fair","field":"eps_ttm"},"mcap":{"name":"Market cap","group":"Valuation","meaning":"What the whole company is worth at tonight's price.","formula":"Market cap = Share price × Number of shares","source":"Tonight's NSE close × shares.","better":"depends","why":"Not good or bad: it tells the size – large caps are steadier, small caps can grow faster and fall harder.","sector_notes":"AMFI: large cap = top 100 by market cap, mid cap = 101–250, small cap = the rest.","example":"₹1,000 × 10 crore shares = ₹10,000 crore.","related":["pe","pb"],"tab":"summary","field":"mcap_cr"},"fair":{"name":"Fair value","group":"Valuation","meaning":"The app's estimate of what a share is worth, from several valuation methods weighted together.","formula":"Fair value = weighted mix of the methods that apply (DCF, P/E band, EV/EBITDA, P/B, Graham number…)","source":"Each method's inputs from the statements; see the Fair value tab.","better":"depends","why":"Price far below fair value = margin of safety; far above = expensive. An estimate, never a promise.","related":["mos","dcf","graham","peband"],"tab":"fair","field":"fair_value"},"mos":{"name":"Margin of safety","group":"Valuation","meaning":"How far the price is below the fair value – room for error in the estimate.","formula":"Margin of safety = (Fair value − Price) ÷ Fair value × 100","source":"Fair value (see above) and tonight's close.","better":"higher","why":"Graham's idea: buy only well below value, so a wrong estimate still doesn't hurt much.","example":"Fair ₹500, price ₹400 → 20% margin of safety.","related":["fair"],"tab":"fair","field":"mos"},"dcf":{"name":"DCF (discounted cash flow)","group":"Valuation","meaning":"The value of all the cash the company should earn in future, brought back to today's money.","formula":"DCF = Σ (years 1–10) FCFₜ ÷ (1 + r)ᵗ + Terminal value ÷ (1 + r)¹⁰; growth g for years 1–5 fading to the terminal growth by year 10; terminal value = FCF₁₀ × (1 + tg) ÷ (r − tg)","source":"Free cash flow = operating cash flow − capex, from the cash-flow statements; cost of capital from the G-sec yield.","better":"depends","why":"The textbook way to value a business; very sensitive to the growth and discount rate you assume.","mistakes":"Small changes in growth or discount rate move the answer a lot – read it as a range.","related":["fair","gsec"],"tab":"fair"},"graham":{"name":"Graham number","group":"Valuation","meaning":"Benjamin Graham's quick upper limit for a defensive buy price.","formula":"Graham number = √(22.5 × EPS × Book value per share)","source":"EPS (last 12 months) and book value per share.","better":"depends","why":"A price under the Graham number passes his P/E × P/B ≤ 22.5 test.","related":["pe","pb"],"tab":"fair"},"peband":{"name":"P/E band","group":"Valuation","meaning":"Where tonight's P/E sits in the company's own P/E range of past years.","formula":"Value = EPS × the company's median P/E of the past years","source":"Daily prices and yearly EPS.","better":"depends","why":"Near the bottom of its own band = cheap for this company; near the top = expensive.","related":["pe"],"tab":"fair"},"evebitda":{"name":"EV/EBITDA method","group":"Valuation","meaning":"A fair value from what similar companies are priced at per rupee of EBITDA.","formula":"Value = Peer median EV/EBITDA × this company's EBITDA − debt + cash, per share","better":"depends","why":"Values the business the way buyers of whole companies do.","related":["ev_ebitda"],"tab":"fair"},"gsec":{"name":"10-year G-sec yield","group":"Market","meaning":"The interest the government pays on 10-year bonds – India's risk-free rate.","formula":"Read from RBI: the government security maturing closest to 10 years from today","source":"rbi.org.in home page, Government Securities Market block.","better":"depends","why":"The base of the cost of equity: higher yields make future profits worth less today.","related":["dcf"],"tab":"fair"},"de":{"name":"Debt to equity (D/E)","group":"Debt & safety","meaning":"Borrowings compared with shareholders' money.","formula":"D/E = Borrowings ÷ Net worth","source":"Balance sheet: borrowings and net worth, newest balance sheet available.","better":"lower","why":"Less debt means less risk when profits fall or rates rise.","sector_notes":"Banks and NBFCs borrow by design – D/E isn't judged for them. Utilities and infrastructure run higher debt.","example":"Borrowings ₹300 crore ÷ net worth ₹1,000 crore = 0.3.","related":["icr","roe"],"tab":"health","field":"de","signal":"de"},"icr":{"name":"Interest cover","group":"Debt & safety","meaning":"How many times operating profit covers the interest bill.","formula":"Interest cover = EBIT ÷ Interest","source":"P&L: EBIT and finance costs, latest year.","better":"higher","why":"Under 1.5× is risky – a small fall in profit could make interest hard to pay.","sector_notes":"Not judged for banks and NBFCs.","example":"EBIT ₹100 crore ÷ interest ₹10 crore = 10×.","mistakes":"Near-zero interest gives huge numbers (thousands of times) – read anything above ~50× as 'almost no debt'.","related":["de"],"tab":"health","field":"icr","signal":"icr"},"pledge":{"name":"Promoter pledge","group":"Debt & safety","meaning":"Share of the promoters' holding they have pledged as security for loans.","formula":"Pledge = Promoter shares pledged ÷ Promoter shares held × 100","source":"NSE shareholding-pattern filings (quarterly).","better":"lower","why":"Over 25% is a red flag: if the price falls, lenders may sell the pledged shares.","related":["promoter"],"tab":"owners","field":"pledge","signal":"pledge"},"mscore":{"name":"Beneish M-score","group":"Debt & safety","meaning":"A statistical test for signs of earnings manipulation.","formula":"M-score = −4.84 + 0.92·DSRI + 0.528·GMI + 0.404·AQI + 0.892·SGI + 0.115·DEPI − 0.172·SGAI + 4.679·TATA − 0.327·LVGI","source":"Two years of P&L and balance sheet.","better":"lower","why":"Above −1.78 suggests a higher chance that profits are being flattered.","mistakes":"A screen, not proof – fast growth alone can push it up.","related":["zscore","accruals"],"tab":"health","field":"mscore"},"zscore":{"name":"Altman Z-score","group":"Debt & safety","meaning":"A formula that estimates the risk of financial distress.","formula":"Z = 1.2·(Working capital/Assets) + 1.4·(Retained earnings/Assets) + 3.3·(EBIT/Assets) + 0.6·(Market cap/Liabilities) + 1.0·(Sales/Assets)","source":"Balance sheet and P&L, latest year.","better":"higher","why":"Above 3 = safe zone; under 1.8 = distress zone.","sector_notes":"Not meaningful for banks and NBFCs.","related":["mscore","de"],"tab":"health","field":"zscore"},"accruals":{"name":"Accruals","group":"Cash flow","meaning":"How much of the profit is not backed by cash.","formula":"Accruals = (Net profit − Operating cash flow) ÷ Total assets","better":"lower","why":"Low accruals mean profit arrives as cash – higher quality earnings.","related":["cfo_pat"],"tab":"health","field":"accruals"},"sales_cagr":{"name":"Sales growth (CAGR)","group":"Growth","meaning":"Average yearly growth of sales over the years we have.","formula":"Sales CAGR = (Last sales ÷ First sales)^(1 ÷ years) − 1","source":"P&L: revenue from operations, first and last year we have.","better":"higher","why":"Steady sales growth is the base of long-term profit growth.","example":"₹100 crore → ₹133 crore in 3 years = 10% a year.","related":["eps_cagr","cagr"],"tab":"health","field":"sales_cagr","signal":"sales_cagr"},"eps_cagr":{"name":"EPS growth (CAGR)","group":"Growth","meaning":"Average yearly growth of earnings per share.","formula":"EPS CAGR = (Last EPS ÷ First EPS)^(1 ÷ years) − 1","source":"P&L: EPS, first and last year we have.","better":"higher","why":"What owners actually get: profit growth after any new shares issued.","related":["sales_cagr","peg"],"tab":"health","field":"eps_cagr","signal":"eps_cagr"},"cagr":{"name":"CAGR","group":"Growth","meaning":"Compound annual growth rate – the steady yearly growth that turns the first value into the last one.","formula":"CAGR = (End ÷ Start)^(1 ÷ years) − 1","better":"higher","why":"Lets you compare growth over different periods on one yearly scale.","example":"₹100 → ₹133 in 3 years = 10% CAGR.","related":["sales_cagr","eps_cagr"]},"ttm":{"name":"TTM","group":"Growth","meaning":"Trailing twelve months – the last four quarters added up, so it is always a full year.","formula":"TTM = sum of the last 4 quarters","better":"depends","why":"Fresher than the last annual report.","example":"TTM sales in November = the four quarters to September.","related":["eps"]},"cfo_pat":{"name":"CFO / PAT (cash conversion)","group":"Cash flow","meaning":"How much of the reported profit came in as cash, over up to 5 years.","formula":"CFO/PAT = Operating cash flow ÷ Profit after tax (sums over up to 5 years)","source":"Cash-flow statement: cash from operations; P&L: profit after tax.","better":"higher","why":"Above 0.9 = profit is real cash; under 0.6 = profit stuck in receivables or inventory.","sector_notes":"Banks and NBFCs: operating cash flow swings with loan growth – not judged the normal way.","example":"Cash ₹450 crore ÷ profit ₹500 crore = 0.9.","related":["accruals"],"tab":"health","field":"cfo_pat","signal":"cfo_pat"},"cfopat":{"name":"CFO / PAT","group":"Cash flow","meaning":"See CFO / PAT (cash conversion).","formula":"CFO/PAT = Operating cash flow ÷ Profit after tax","better":"higher","why":"Profit that arrives as cash is real profit.","related":["cfo_pat"],"tab":"health"},"debtor_days":{"name":"Debtor days","group":"Efficiency","meaning":"How many days customers take to pay, on average.","formula":"Debtor days = Receivables ÷ Revenue × 365","source":"Balance sheet: trade receivables; P&L: revenue.","better":"lower","why":"Fewer days = cash comes in faster; rising days can hide weak sales.","sector_notes":"Retail and FMCG are near zero; capital goods and infrastructure run long.","related":["inventory_days","payable_days"],"tab":"health","field":"debtor_days"},"inventory_days":{"name":"Inventory days","group":"Efficiency","meaning":"How many days of goods sit in stock.","formula":"Inventory days = Inventory ÷ Cost of goods sold × 365","better":"lower","why":"Fewer days = less money tied up in stock.","sector_notes":"IT, banks and most services have no inventory.","related":["debtor_days"],"tab":"health","field":"inventory_days"},"payable_days":{"name":"Payable days","group":"Efficiency","meaning":"How many days the company takes to pay its suppliers.","formula":"Payable days = Payables ÷ Cost of goods sold × 365","better":"in a range","why":"Some credit from suppliers is good; very long days can mean the company is struggling to pay.","related":["debtor_days"],"tab":"health","field":"payable_days"},"promoter":{"name":"Promoter holding","group":"Ownership","meaning":"Share of the company owned by its founders / controlling group.","formula":"Promoter holding = Promoter shares ÷ Total shares × 100","source":"NSE shareholding-pattern filings (quarterly).","better":"depends","why":"High and steady holding shows skin in the game; a falling holding deserves a look.","related":["pledge","promoter_chg"],"tab":"owners","field":"promoter_holding"},"promoter_chg":{"name":"Promoter change","group":"Ownership","meaning":"Change in promoter holding over the last 4 quarters, in percentage points.","formula":"Promoter change = Holding now − Holding 4 quarters ago","better":"higher","why":"Promoters selling down can signal less confidence; buying, more.","related":["promoter"],"tab":"owners","field":"promoter_chg_4q"},"insider":{"name":"Insider net buying","group":"Ownership","meaning":"What directors and senior staff bought minus what they sold, in ₹ crore over 12 months.","formula":"Insider net = Insider buys − Insider sells (₹ crore, 12 months)","source":"NSE insider-trading (PIT) disclosures.","better":"higher","why":"Insiders know the business best; net buying is a good sign.","related":["promoter"],"tab":"owners","field":"insider_net_cr"},"redflags":{"name":"Red flags","group":"Scores & rules","meaning":"Warning signs found in the data: auditor quits, pledges, regulatory orders, surveillance, accounting tests.","formula":"Count of the red-flag rules that fire for this stock","better":"lower","why":"A hard red flag makes the verdict Avoid and exits the model portfolio.","related":["verdict"],"tab":"owners","field":"red_flags"},"rsi":{"name":"RSI (14 days)","group":"Technicals","meaning":"How fast and how far the price has moved recently, on a 0–100 scale.","formula":"RSI = 100 − 100 ÷ (1 + average gain ÷ average loss), Wilder's 14-day smoothing","source":"Daily NSE closes.","better":"in a range","why":"Over 70 = stretched after a fast rise; under 30 = oversold after a fast fall. A state, not good or bad.","related":["dma"],"tab":"chart","field":"rsi14","signal":"rsi14"},"dma":{"name":"Moving average (50 / 200 days)","group":"Technicals","meaning":"The average closing price of the last 50 or 200 trading days.","formula":"DMA = sum of the last N closes ÷ N","source":"Daily NSE closes.","better":"depends","why":"Price above the 200-day average = long-term uptrend.","related":["rsi"],"tab":"chart"},"high52":{"name":"From 1-year high","group":"Technicals","meaning":"How far tonight's close is below the highest close of the last year.","formula":"From high = (Close ÷ 52-week high − 1) × 100","source":"Daily NSE closes.","better":"higher","why":"Near the high = strong trend; far below = fallen (cheap or broken – check why).","related":["dma"],"tab":"summary","field":"pct_from_high52","signal":"pct_from_high52"},"volratio":{"name":"Volume (× normal)","group":"Technicals","meaning":"Tonight's traded volume compared with the 20-day average.","formula":"Volume ratio = Today's volume ÷ 20-day average volume","better":"depends","why":"A big spike with a price move means real buying or selling behind it.","related":["rsi"],"tab":"chart","field":"vol_ratio"},"tv":{"name":"Traded value","group":"Market","meaning":"Rupees traded in the stock per day (median of about 3 months).","formula":"Traded value = median of (daily close × daily volume) over 63 trading days, ₹ crore","better":"higher","why":"Under ₹5 crore a day the stock is thin – buying or selling can move the price.","related":["mcap"],"tab":"summary","field":"traded_value_cr"},"vix":{"name":"India VIX","group":"Market","meaning":"NSE's 'fear gauge': how much the market expects the Nifty 50 to swing over the next 30 days, from option prices.","formula":"VIX = expected 30-day volatility of the Nifty 50 (annualised %), published by NSE","better":"depends","why":"Higher = more nervous; spikes often come near market lows.","example":"VIX 12 = calm; VIX 25 = jittery.","related":["breadth"]},"breadth":{"name":"Breadth","group":"Market","meaning":"How many stocks rose vs fell today.","formula":"Breadth = Stocks up ÷ Stocks down","better":"higher","why":"A rise led by few stocks is weaker than one where most stocks rose.","example":"1,800 up and 900 down = broad buying.","related":["vix"]},"fii":{"name":"FII / DII flows","group":"Market","meaning":"Net buying (+) or selling (−) in the cash market by foreign investors (FII/FPI) and domestic institutions (DII).","formula":"Net flow = Buys − Sells (₹ crore), NSE provisional figures","better":"depends","why":"Big steady foreign selling often pressures large caps; domestic funds often buy the dips.","example":"FIIs −₹2,000 crore = they sold ₹2,000 crore more than they bought.","related":["breadth"]},"shocker":{"name":"Results shock","group":"Market","meaning":"A quarterly result much worse than the company's own recent trend.","formula":"Shock = profit falls far below its recent quarters","better":"lower","why":"A shock often keeps hurting the price for weeks.","related":["ttm"]},"tri":{"name":"TRI (total return index)","group":"Portfolio & tax","meaning":"An index that adds back dividends, so it shows the full return of owning the stocks.","formula":"TRI = price index + dividends reinvested","better":"higher","why":"The fair benchmark: the ghosts and your portfolio are compared with the Nifty 500 TRI.","related":["drawdown","xirr"]},"xirr":{"name":"XIRR","group":"Portfolio & tax","meaning":"Your yearly return, counting the date and size of every buy and sell.","formula":"XIRR = the yearly rate r where Σ cash flow ÷ (1 + r)^(days ÷ 365) = 0","better":"higher","why":"The right return for money added at different times.","related":["tri","cagr"],"tab":"portfolio"},"avgprice":{"name":"Average price","group":"Portfolio & tax","meaning":"What you paid per share on average, including charges.","formula":"Average price = (Σ quantity × price + charges) ÷ shares held","better":"depends","why":"Your break-even: above it you are in profit.","related":["pnl"],"tab":"portfolio"},"pnl":{"name":"Realised / unrealised P&L","group":"Portfolio & tax","meaning":"Realised = profit or loss already booked by selling; unrealised = on paper, on shares you still hold.","formula":"Unrealised = (Tonight's close − Average price) × Shares held","better":"higher","why":"Only realised gains are taxed.","related":["avgprice","ltcg","stcg"],"tab":"portfolio"},"ltcg":{"name":"LTCG","group":"Portfolio & tax","meaning":"Long-term capital gain: listed shares held more than 12 months.","formula":"LTCG = Sale value − Cost, for shares held > 12 months (FIFO lots)","better":"depends","why":"Taxed lower than short-term, with a yearly tax-free limit (₹1.25 lakh under the current rules).","example":"Bought 1 Jan 2025, sold 2 Feb 2026 = long-term.","related":["stcg"],"tab":"portfolio"},"stcg":{"name":"STCG","group":"Portfolio & tax","meaning":"Short-term capital gain: listed shares sold within 12 months.","formula":"STCG = Sale value − Cost, for shares held ≤ 12 months (FIFO lots)","better":"depends","why":"Taxed at a higher rate than long-term gains.","related":["ltcg"],"tab":"portfolio"},"drawdown":{"name":"Drawdown","group":"Portfolio & tax","meaning":"How far a value has fallen from its highest point so far.","formula":"Drawdown = (Value ÷ Highest value so far − 1) × 100","better":"higher","why":"The worst drawdown shows the pain you'd have had to sit through.","related":["tri"]},"core":{"name":"Core score","group":"Scores & rules","meaning":"The app's frozen 0–100 ranking score (Rules v1.0) – 40% quality vs sector, 30% value, 30% momentum.","formula":"Core = 0.40 × Quality-vs-sector + 0.30 × Value + 0.30 × Momentum (each a sector percentile)","better":"higher","why":"The model portfolios pick the top 20 eligible stocks by Core score.","related":["qvsector","piotroski","verdict"],"tab":"summary","field":"core","signal":"core"},"qvsector":{"name":"Quality vs sector","group":"Scores & rules","meaning":"This stock's quality rank inside its sector (0–100) – 40% of the Core score.","formula":"Percentile of return stability, ROE/ROCE, cash conversion, debt and F-score inside the sector","better":"higher","why":"Shows whether the business is better run than its peers.","related":["core"],"tab":"summary"},"bizhealth":{"name":"Business health","group":"Scores & rules","meaning":"How healthy the business is – profitability, debt, cash and growth – as a 0–100 score used by the verdict (Buy needs 70+).","formula":"Business health = sector-rule checks on ROCE/ROE, debt, cash conversion, growth and margins, scored 0–100","better":"higher","why":"A healthy business survives bad years; the Buy rule needs 70 or more.","related":["core","verdict"],"tab":"summary","field":"quality","signal":"health"},"piotroski":{"name":"Piotroski F-score","group":"Scores & rules","meaning":"Nine yes/no checks on profit, cash, debt and efficiency (0–9).","formula":"F-score = number of the 9 Piotroski tests passed","source":"Two years of P&L, balance sheet and cash flow.","better":"higher","why":"7–9 strong, 4–6 average, 0–3 weak.","related":["core"],"tab":"investors","field":"fscore","signal":"fscore"},"verdict":{"name":"Verdict","group":"Scores & rules","meaning":"The app's simple-rule group: Buy, Accumulate, Hold, Trim or Avoid (experimental).","formula":"Verdict = business health + price vs fair value + red flags, by fixed rules","better":"depends","why":"A sorting of today's numbers – not advice and not a prediction.","related":["bizhealth","fair","redflags"],"tab":"summary"},"roe_avg":{"name":"Average ROE","group":"Profitability","meaning":"ROE averaged over the last (up to) 5 years we have.","formula":"Average ROE = mean of the yearly ROE values (last 5 years at most)","source":"The yearly ROE history (see ROE).","better":"higher","why":"A steady high ROE across years is worth more than one good year.","related":["roe","roce_avg"],"tab":"health","field":"roe_avg"},"value_pillar":{"name":"Value (Core pillar)","group":"Scores & rules","meaning":"How cheap the stock is compared with its sector (0–100) – 30% of the Core score.","formula":"Value = average sector percentile of earnings yield, free-cash-flow yield, P/B (lenders) and P/E vs its own history","better":"higher","why":"A higher Value pillar means you pay less for each rupee of profit or book than peers do.","related":["core","earnings_yield","pb"],"tab":"summary"},"momentum_pillar":{"name":"Momentum (Core pillar)","group":"Scores & rules","meaning":"How strongly the price has been rising compared with its sector (0–100) – 30% of the Core score.","formula":"Momentum = average of the 12-1 month return percentile, closeness to the 52-week high percentile and above-200-day (100 / 0)","better":"higher","why":"Stocks that have been rising tend to keep doing so for a while; a falling price often has a reason.","related":["core","high52","dma"],"tab":"summary"},"lens":{"name":"Investor lens score","group":"Scores & rules","meaning":"The share of a famous investor's checks (Graham, Buffett, Lynch …) this stock passes, from our data.","formula":"Lens % = checks passed (incl. partial checks leaning pass) ÷ checks we could run × 100","better":"higher","why":"More checks passed means the stock fits that investor's published style better – a teaching aid, not their opinion.","sector_notes":"Some checks are skipped for banks/NBFCs (e.g. debt to equity); the score is out of the checks we could run.","related":["piotroski","core"],"tab":"investors"},"invested":{"name":"Invested / current value","group":"Portfolio & tax","meaning":"Invested = what you paid for the shares you still hold; current value = those shares at the latest close.","formula":"Invested = Σ (shares held × average buy price incl. charges); Current value = Σ (shares held × latest close)","better":"depends","why":"Current value above invested means an unrealised gain; it is only real when you sell.","related":["avgprice","pnl","xirr"],"tab":"portfolio"},"tv_daily":{"name":"Daily traded value","group":"Market","meaning":"The median rupee value of shares traded per day over the last year.","formula":"Daily traded value = median over 1 year of (shares traded × close), in ₹ crore","better":"higher","why":"Below ₹5 crore a day a stock is hard to buy or sell without moving the price.","relat
